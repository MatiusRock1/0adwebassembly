# Static site for the browser build: the landing page at / and the game at /play/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pthreads need SharedArrayBuffer, which browsers only allow in a
    # cross-origin isolated page. Every response carries these headers.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Revalidate instead of trusting a cached copy: archive blocks are checked
    # against archive-blocks.json, which changes with every build.
    add_header Cache-Control "no-cache" always;

    # The complete list, as a types block replaces the inherited one.
    types {
        text/html                html;
        text/css                 css;
        text/javascript          js mjs;
        application/json         json;
        application/wasm         wasm;
        application/zip          zip;
        application/octet-stream dat;
        text/plain               txt cfg config md;
    }
    default_type application/octet-stream;

    # Archives are already compressed and are read with Range requests;
    # nginx answers ranges only for responses it does not compress.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/json application/wasm text/plain;

    location / {
        try_files $uri $uri/ =404;
    }
}
